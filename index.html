<!DOCTYPE html>
<!--
==================================================================
  auraii : COMMENT LIRE CE FICHIER (index.html)
==================================================================
  Ce fichier contient TOUT le site, en 3 grandes parties :

  PARTIE 1  (style)   : l’APPARENCE (couleurs, tailles, animations)
  PARTIE 2  (body)     : la STRUCTURE (menu, fenêtres, zone principale)
  PARTIE 3  (script)  : le COMPORTEMENT (clics, comptes, projets, likes)
  PARTIE 4  (module)  : FIREBASE, la connexion des comptes clients (tout en bas)

  Chaque partie est découpée en blocs numérotés avec un bandeau
  « ===== TITRE ===== ». Utilisez la recherche (Ctrl+F) sur un titre.

  Pour modifier :
   - une couleur .................. PARTIE 1, bloc 1
   - le texte de l’accueil ........ PARTIE 3, fonction home()
   - les catégories ............... PARTIE 3, bloc 1 (CATS)
   - la configuration Firebase .... PARTIE 4 (tout en bas du fichier)
   - la liste de mots interdits ... PARTIE 3, bloc EXPLORER (BAD)
==================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>auraii — créez avec l’IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ################ PARTIE 1 : APPARENCE (CSS) ################ */
/* ======== 1. COULEURS ET RÉGLAGES GÉNÉRAUX (changez les couleurs ici : --g = le vert, --bg = le fond noir) ======== */
:root{--bg:#040705;--p1:#0A100C;--p2:#101811;--line:#1C271F;--tx:#E8F2EA;--mu:#7C8C81;--g:#2DFF8A;--g2:#0C5A33;--on:#031007;
box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-behavior:smooth}
:root[data-theme="dark"]{--bg:#040705}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#040705}}
html{scroll-padding-top:90px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.55 "Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:Syne,"Inter Tight",system-ui,sans-serif;margin:0;letter-spacing:-.035em;line-height:1}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--g);color:var(--on)}
:focus-visible{outline:2px solid var(--g);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
/* ======== 2. BARRE DE NAVIGATION (le menu en haut) ======== */
nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 18px;border:1px solid var(--line);border-radius:99px;background:rgba(8,13,10,.72);backdrop-filter:blur(16px);width:min(560px,calc(100% - 24px))}
.logo{font:800 20px Syne,sans-serif;letter-spacing:-.04em;background:none;border:0;padding:0;margin-right:auto;display:flex;align-items:center;gap:8px}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}
.lk{background:none;border:0;padding:9px 14px;border-radius:99px;color:var(--mu);font-weight:500;font-size:15px;transition:color .2s,background .2s}
.lk:hover,.lk[aria-current="page"]{color:var(--tx);background:var(--p2)}
.btn{background:var(--g);color:var(--on);border:0;border-radius:99px;padding:10px 20px;font-weight:600;font-size:15px;transition:box-shadow .25s,transform .15s}
.btn:hover{box-shadow:0 0 28px rgba(45,255,138,.45)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--g)}
.btn:disabled{opacity:.6;cursor:wait}
/* ======== 3. ACCUEIL : le grand écran d’entrée avec le mot « auraii » ======== */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 0 24px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px circle at var(--mx,70%) var(--my,35%),rgba(45,255,138,.22),transparent 65%),radial-gradient(900px circle at 85% 110%,var(--g2),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 70%);opacity:.5}
.lead{font:500 clamp(22px,3.2vw,38px)/1.15 Syne,sans-serif;letter-spacing:-.03em;max-width:20ch;margin-bottom:28px}
.lead em{font-style:normal;color:var(--mu)}
.cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.big{font:800 clamp(90px,26vw,360px)/.8 Syne,sans-serif;letter-spacing:-.07em;margin:12px 0 -.07em -.04em;display:flex;user-select:none}
.big span{display:inline-block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 150ms)}
.big span:last-child{color:var(--g);text-shadow:0 0 60px rgba(45,255,138,.5)}
@keyframes up{to{transform:none}}
/* ======== 4. BANDE DÉFILANTE d’exemples de descriptions ======== */
.mq{border-block:1px solid var(--line);overflow:hidden;padding:16px 0;background:var(--p1)}
.mq div{display:flex;gap:48px;width:max-content;animation:mq 60s linear infinite;color:var(--mu);font-size:18px}
.mq b{color:var(--g);font-weight:500}
@keyframes mq{to{transform:translateX(-50%)}}
/* ======== 5. STUDIO : choix de catégorie + zone d’écriture + boutons ======== */
section{padding:110px 0}
.hd{font-size:clamp(34px,5.5vw,68px);max-width:16ch}
.sub{color:var(--mu);max-width:48ch;margin:16px 0 0}
.studio{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;margin-top:48px;align-items:start}
.cats{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.cat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 4px;color:var(--mu);transition:color .25s,padding .25s}
.cat strong{font:700 clamp(30px,4.4vw,54px) Syne,sans-serif;letter-spacing:-.04em;line-height:1}
.cat small{font-size:14px;opacity:0;transition:opacity .25s}
.cat:hover{color:var(--tx)}
.cat[aria-pressed="true"]{color:var(--g);padding-left:18px}.cat[aria-pressed="true"] small{opacity:1}
.box{background:var(--p1);border:1px solid var(--line);border-radius:24px;padding:20px;position:sticky;top:90px;transition:border-color .3s,box-shadow .3s}
.box:focus-within{border-color:var(--g);box-shadow:0 0 0 4px rgba(45,255,138,.08),0 0 60px rgba(45,255,138,.08)}
.lab{color:var(--mu);font-size:14px;margin-bottom:8px;display:block}
textarea{width:100%;min-height:150px;resize:vertical;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:19px;line-height:1.45}
textarea::placeholder{color:#4A5A4F}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{background:transparent;border:1px solid var(--line);color:var(--mu);border-radius:99px;padding:6px 14px;font-size:14px;transition:.2s}
.chip:hover{color:var(--tx);border-color:var(--mu)}
.chip[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:var(--on);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--mu);font-size:14px}
.go{background:var(--g);color:var(--on);border:0;border-radius:14px;padding:14px 28px;font:700 17px Syne,sans-serif;letter-spacing:-.02em;transition:box-shadow .25s,transform .15s}
.go:hover{box-shadow:0 0 36px rgba(45,255,138,.5)}.go:disabled{opacity:.6;cursor:wait}
.prog{height:2px;background:var(--line);margin-top:16px;overflow:hidden;display:none}.prog i{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 12px var(--g);transition:width .6s}
.st{color:var(--g);font-size:14px;min-height:22px;margin-top:8px}
/* ======== 6. RÉSULTAT : la création affichée après génération ======== */
.res{margin-top:36px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(160deg,var(--p2),var(--p1));padding:clamp(22px,4vw,44px)}
.tag{display:inline-flex;gap:8px;align-items:center;color:var(--g);font-size:14px;font-weight:600;border:1px solid rgba(45,255,138,.35);border-radius:99px;padding:4px 12px}
.res h2{font-size:clamp(30px,5vw,56px);margin:16px 0 8px}
.sec{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:16px;animation:fi .5s both}
.sec h3{font-size:18px;color:var(--g)}.sec p{margin:0;color:#B9C7BD;max-width:64ch}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.demo{color:var(--mu);font-size:13px;margin-top:22px}
/* ======== 7. SECTION « TROIS GESTES » et pied de page ======== */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px;border-top:1px solid var(--line)}
.step{padding:28px 28px 0 0}.step+.step{padding-left:28px;border-left:1px solid var(--line)}
.step b{font:700 15px Syne,sans-serif;color:var(--g)}.step h3{font-size:30px;margin:14px 0 10px}.step p{color:var(--mu);margin:0}
footer{border-top:1px solid var(--line);padding:40px 0 60px;color:var(--mu);font-size:14px}
footer .row strong{font:800 26px Syne,sans-serif;color:var(--tx);letter-spacing:-.04em}
/* ======== 8. PAGE PROFIL : mes projets, onglets, cartes ======== */
.pro{padding:150px 0 100px;min-height:100svh}
.ph{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.av{width:84px;height:84px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;font:800 38px Syne,sans-serif;box-shadow:0 0 50px rgba(45,255,138,.35)}
.ph h1{font-size:clamp(38px,7vw,84px)}
.tabs{display:flex;gap:6px;margin:34px 0 20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.tab{background:none;border:0;padding:8px 16px;border-radius:99px;color:var(--mu);font-weight:500}.tab[aria-selected="true"]{background:var(--g);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:240px;transition:border-color .25s,transform .25s,box-shadow .25s}
.card:hover{border-color:var(--g);transform:translateY(-3px);box-shadow:0 12px 50px rgba(45,255,138,.08)}
.card h3{font-size:26px;line-height:1.05}.card p{margin:0;color:var(--mu);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .row{margin-top:auto}
.vis{display:inline-flex;align-items:center;gap:9px;background:none;border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 6px;font-size:14px}
.vis i{width:28px;height:16px;border-radius:99px;background:var(--line);position:relative;transition:.2s}.vis i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--tx);transition:.2s}
.vis[aria-pressed="true"]{border-color:rgba(45,255,138,.5);color:var(--g)}.vis[aria-pressed="true"] i{background:var(--g)}.vis[aria-pressed="true"] i::after{transform:translateX(12px);background:var(--on)}
.mini{background:none;border:0;color:var(--mu);padding:6px 8px;font-size:14px}.mini:hover{color:var(--g)}
.empty{border:1px dashed var(--line);border-radius:20px;padding:60px 20px;text-align:center;color:var(--mu)}
/* ======== 9. FENÊTRES (connexion, fiche d’une création) et message de confirmation ======== */
dialog{border:1px solid var(--line);border-radius:26px;background:var(--p1);color:var(--tx);padding:30px;width:min(440px,92vw);max-height:90vh}
dialog#vd{width:min(760px,94vw)}
dialog::backdrop{background:rgba(2,4,3,.8);backdrop-filter:blur(6px)}
dialog h2{font-size:38px;margin-bottom:8px}
label.f{display:block;font-weight:500;font-size:14px;color:var(--mu);margin:16px 0 6px}
input{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}input:focus{border-color:var(--g);outline:0}
.err{color:#FF6B6B;font-size:14px;min-height:20px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--g);color:var(--on);padding:11px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;z-index:90;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
/* ======== 11. ADAPTATION AU TÉLÉPHONE ET À LA TABLETTE ======== */
@media (max-width:860px){.studio{grid-template-columns:1fr}.box{position:static}.steps{grid-template-columns:1fr}.step,.step+.step{padding:24px 0;border-left:0;border-bottom:1px solid var(--line)}.sec{grid-template-columns:1fr;gap:6px}section{padding:80px 0}.lk{padding:9px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.big span{transform:none}}

/* ======== 9b. BOUTON CROIX (✕) pour fermer les fenêtres ======== */
.x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--p2);color:var(--tx);font-size:16px;line-height:1;display:grid;place-items:center;z-index:3;transition:border-color .2s,color .2s}
.x:hover{border-color:var(--g);color:var(--g)}
/* ======== 10. EXPLORER : bannière, affiches façon Netflix, recherche, créateurs ======== */
.btn.sm{padding:7px 16px;font-size:14px}
.bbd{position:relative;margin-top:40px;border-radius:28px;overflow:hidden;min-height:400px;display:flex;align-items:flex-end;padding:clamp(22px,4vw,48px);background:radial-gradient(600px circle at 80% 15%,hsl(var(--h) 90% 38%/.55),transparent 60%),linear-gradient(160deg,hsl(var(--h) 70% 16%),#040705);border:1px solid var(--line)}
.bbd h2{font-size:clamp(36px,6vw,78px);margin:14px 0 10px;max-width:14ch}.bbd p{color:#B9C7BD;max-width:50ch;margin:0 0 20px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.rt{font:700 clamp(22px,2.6vw,30px) Syne,sans-serif;letter-spacing:-.03em;margin:44px 0 14px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -24px;padding:6px 24px 16px}
.rail::-webkit-scrollbar,.crs::-webkit-scrollbar{display:none}
.poster{flex:0 0 184px;aspect-ratio:2/3;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;padding:14px;border:1px solid var(--line);border-radius:18px;color:var(--tx);background:radial-gradient(120% 80% at 80% 0,hsl(var(--h) 85% 34%/.5),transparent 60%),linear-gradient(170deg,hsl(var(--h) 60% 18%),hsl(var(--h) 50% 5%));transition:transform .25s,border-color .25s,box-shadow .25s}
.poster:hover{transform:scale(1.06);border-color:var(--g);box-shadow:0 18px 50px rgba(45,255,138,.18);z-index:2}
.poster b{font:700 21px/1.05 Syne,sans-serif;letter-spacing:-.03em}.poster small{color:#A9BBAF;font-size:13px}
.poster .pc{align-self:flex-start;font-size:12px;font-weight:600;color:var(--g);border:1px solid rgba(45,255,138,.35);border-radius:99px;padding:2px 9px;margin-bottom:auto}
.srch{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:44px}.srch input{max-width:300px;border-radius:99px;margin-right:6px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px;margin-top:22px}.sgrid .poster{flex:none}
.crs{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.cr{flex:0 0 150px;text-align:center;background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:18px 10px}
.cr .av{width:58px;height:58px;font-size:24px;margin:0 auto 10px;box-shadow:none;border:0;cursor:pointer}.cr b{display:block;font:700 15px Syne,sans-serif;margin-bottom:10px}
@media (max-width:560px){nav{padding-left:14px}.logo{font-size:17px}.lk{padding:8px 7px;font-size:13px}nav .btn{padding:8px 12px;font-size:13px}.poster{flex-basis:150px}.bbd{min-height:340px}}
</style>
</head>
<body>
<!-- ################ PARTIE 2 : STRUCTURE (HTML) ################ -->
<!-- Barre de navigation fixe en haut : logo, Studio, Ma liste, Profil, Connexion -->
<nav aria-label="Navigation principale">
<button class="logo" data-go="home" aria-label="auraii, accueil">auraii<i></i></button>
<button class="lk" data-go="studio" id="n-studio">Studio</button>
<button class="lk" data-go="list" id="n-list">Ma liste</button>
<button class="lk" data-go="profile" id="n-profile">Profil</button>
<span id="auth"></span>
</nav>
<!-- Zone principale : le JavaScript y affiche l’accueil, le profil ou Ma liste -->
<div id="app"></div>

<!-- FENÊTRE DE CONNEXION / CRÉATION DE COMPTE (bouton ✕ pour fermer) -->
<dialog id="ad"><button type="button" class="x" id="ax" aria-label="Fermer">✕</button><h2 id="at">Connexion</h2><div class="hint" id="as">Retrouvez tous vos projets.</div>
<form id="af"><div id="nw" hidden><label class="f" for="an">Nom affiché</label><input id="an" autocomplete="name"></div>
<label class="f" for="am">E-mail</label><input id="am" type="email" required autocomplete="email">
<label class="f" for="ap">Mot de passe</label><input id="ap" type="password" required minlength="6">
<div class="err" id="ae" role="alert"></div>
<div class="row" style="margin-top:10px"><button type="button" class="mini" id="asw">Créer un compte</button><button class="btn" id="asb">Se connecter</button></div></form></dialog>
<!-- FENÊTRE DE FICHE : détail d’une création ou profil d’un créateur -->
<dialog id="vd"><button type="button" class="x" id="vx" aria-label="Fermer">✕</button><div id="vb"></div><div class="row" style="margin-top:22px"><span></span><button class="btn ghost" id="vc">Fermer</button></div></dialog>
<!-- Petit message temporaire en bas de l’écran (ex. « Lien copié ») -->
<div class="toast" id="toast" role="status"></div>

<script>
// ################ PARTIE 3 : COMPORTEMENT (JavaScript) ################
(function(){
// ============================================================
// 1. LES CATÉGORIES (nom, description, exemples d’idées). Ajoutez-en ici.
// ============================================================
var CATS={
film:{n:"Film",d:"Scénario et plan",out:"Scénario et plan de film",ph:"Un thriller dans une station spatiale où l’équipage revit la même journée…",ex:["Un huis clos sous-marin","Une comédie romantique à Lisbonne"]},
musique:{n:"Musique",d:"Morceau et paroles",out:"Structure et paroles du morceau",ph:"Une chanson électro mélancolique sur le dernier train de nuit…",ex:["Une ballade folk au lever du jour","Un titre techno pour courir"]},
jeux:{n:"Jeux",d:"Concept et mécaniques",out:"Concept et mécaniques de jeu",ph:"Un jeu de plateforme où l’on contrôle le temps dans une forêt mouvante…",ex:["Un jeu de cartes cosy","Un roguelike en bibliothèque"]},
livre:{n:"Livre",d:"Plan et chapitres",out:"Plan et chapitres du livre",ph:"Un roman jeunesse sur une bibliothécaire dont les livres s’écrivent la nuit…",ex:["Un polar en Bretagne","Un recueil de nouvelles de science-fiction"]},
education:{n:"Éducation",d:"Parcours pédagogique",out:"Parcours pédagogique",ph:"Un cours de 4 semaines pour initier des collégiens à l’astronomie…",ex:["Apprendre Python en 30 jours","Atelier d’écriture pour adultes"]}
};
var TONES=["Sobre","Épique","Poétique","Drôle"];
// ============================================================
// 2. STOCKAGE : sauvegarde dans le navigateur (comptes, projets, likes)
// ============================================================
var mem={};
// Lit ou écrit une valeur dans la mémoire du navigateur
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r===null?mem[k]:r}localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k];mem[k]=v}}
// Lit une valeur JSON (avec une valeur par défaut)
function jget(k,d){try{var r=ls(k);return r?JSON.parse(r):d}catch(e){return d}}
// Protège le texte saisi (sécurité)
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var $=function(s){return document.querySelector(s)},$$=function(s){return document.querySelectorAll(s)};
var user=jget("fab_session",null),cat="film",tone="Sobre",pending=false,filter="all",busy=false,draft="",q="",fc="all";
if(user&&!user.uid)user=null; // ancienne session de démonstration (sans Firebase) : ignorée
// Renvoie les projets de l’utilisateur connecté
function projects(){return user?jget("aur_p_"+user.email,[]):[]}
// Enregistre les projets de l’utilisateur
function save(p){ls("aur_p_"+user.email,JSON.stringify(p))}
// Affiche un petit message temporaire

/* Génération simulée : à brancher sur votre modèle IA */
// Fabrique la création (SIMULÉE) à partir de la description
// ADRESSE DE VOTRE SERVEUR IA (le service Render « auraii-api », dossier api/).
// Exemple : "https://auraii-api.onrender.com/generate"
// Laissez "" pour garder la génération SIMULÉE (utile pour tester le site).
var API_URL="https://auraii-api.onrender.com/generate";
// Réveille le serveur IA dès l’ouverture du site (l’offre gratuite de Render s’endort après 15 min)
if(API_URL){try{fetch(API_URL,{mode:"no-cors"}).catch(function(){})}catch(e){}}
// Demande une création au serveur IA (ou à la simulation si API_URL est vide)
async function aiGenerate(k,p,t){
 if(!API_URL)return gen(k,p,t);
 var tok=window.fb&&window.fb.token?await window.fb.token():null;
 if(!tok)throw new Error("Reconnectez-vous pour créer.");
 var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok},body:JSON.stringify({category:k,prompt:p,tone:t})});
 var d=await r.json().catch(function(){return{}});
 if(!r.ok)throw new Error(d.error||"Erreur du serveur ("+r.status+").");
 if(!d.title||!d.sections)throw new Error("Réponse inattendue du serveur.");
 return d}
// Fabrique la création (SIMULÉE) à partir de la description
function gen(k,p,t){
 var w=p.trim().split(/\s+/),ti=w.slice(0,6).join(" ").replace(/[.,;:!?…]+$/,"");ti=ti.charAt(0).toUpperCase()+ti.slice(1);
 var s=p.length>150?p.slice(0,150)+"…":p,T=" Ton "+t.toLowerCase()+".";
 var S={
 film:[["Logline","Un récit en tension autour de : "+s+T],["Acte 1","Le héros, son monde, puis l’événement qui bouleverse tout."],["Acte 2","Les obstacles s’accumulent, les alliances se fissurent, la vérité se dévoile."],["Acte 3","Un choix décisif, un dernier face-à-face et une image finale marquante."]],
 musique:[["Concept","Un morceau construit à partir de : "+s+T],["Structure","Intro, couplet, refrain, couplet, refrain, pont, refrain final."],["Son","Tempo, instruments et textures choisis pour servir l’émotion du brief."],["Refrain","Une phrase simple et mémorable, reprise avec une variation à chaque passage."]],
 jeux:[["Concept","Un jeu inspiré de : "+s+T],["Boucle de jeu","Explorer, relever un défi, gagner une récompense, débloquer une capacité."],["Mécaniques","Trois mécaniques centrales qui s’enrichissent à chaque niveau."],["Progression","Cinq niveaux d’initiation, un boss intermédiaire, un final qui réunit tout."]],
 livre:[["Pitch","Un livre né de : "+s+T],["Personnages","Un protagoniste attachant, un allié inattendu, une force qui s’oppose."],["Plan","Douze chapitres : mise en place, indices, bascule, épreuves, climax, épilogue."],["Ouverture","Une scène concrète qui installe le ton et pose la question qui portera le récit."]],
 education:[["Objectif","Un parcours pour répondre à : "+s+T],["Prérequis","Aucun : chaque notion part d’un exemple du quotidien."],["Modules","Découvrir, comprendre, pratiquer, évaluer, chacun avec activité et quiz."],["Évaluation","Un mini-projet final et un quiz de dix questions."]]};
 return{title:ti,sections:S[k].map(function(x){return{h:x[0],p:x[1]}})};
}
// Dessine le résultat d’une création
function resHTML(p,stream){return'<div class="res"><span class="tag">'+CATS[p.cat].out+' · ton '+esc((p.tone||"sobre").toLowerCase())+'</span><h2>'+esc(p.title)+'</h2>'+p.sections.map(function(s,i){return'<div class="sec" style="animation-delay:'+(stream?i*350+200:0)+'ms"><h3>'+esc(s.h)+'</h3><p>'+esc(s.p)+'</p></div>'}).join("")+'<div class="demo">Aperçu de démonstration : la génération réelle sera reliée à votre modèle IA.</div></div>'}

var BAD=/(^|[^a-zà-ÿ])(sexe|porno|porn|nu|nue|nus|sang|gore|meurtre|tuer|viol|drogue|drogues|arme|armes|haine|suicide|massacre|cadavre|érotique|erotique|torture)([^a-zà-ÿ]|$)/i;

// 6. CRÉER UN PROJET : start() lance la génération et l’enregistre
// ============================================================
function start(){
 if(busy)return;var v=($("#pr").value||"").trim();
 if(v.length<10){$("#st").textContent="Ajoutez quelques mots de plus (10 caractères minimum).";return}
 if(BAD.test(v)){$("#st").textContent="auraii est un espace tout public. Reformulez votre idée sans contenu violent ou inapproprié.";return}
 if(!user){pending=true;openAuth("login");return}
 busy=true;var go=$("#go"),pg=$("#pg"),bar=pg.firstChild,st=$("#st"),steps=["Analyse de votre idée…","Écriture en cours…","Mise en forme…"];
 go.disabled=true;go.textContent="Création en cours…";pg.style.display="block";$("#out").innerHTML="";
 steps.forEach(function(t,i){setTimeout(function(){st.textContent=t;bar.style.width=(i+1)*30+"%"},i*800)});
 if(API_URL)setTimeout(function(){if(busy)st.textContent="Le serveur se réveille, cela peut prendre jusqu’à une minute…"},7000);
 var wait=new Promise(function(r){setTimeout(r,2500)});
 Promise.all([aiGenerate(cat,v,tone),wait]).then(function(res){
  var g=res[0],p={id:Date.now().toString(36),cat:cat,tone:tone,prompt:v,title:g.title,sections:g.sections,public:false,date:Date.now()};
  var a=projects();a.unshift(p);save(a);draft="";busy=false;home();
  $("#out").innerHTML=resHTML(p,true)+'<div class="row" style="margin-top:16px"><span class="hint">Enregistré dans vos projets (privé).</span><button class="btn" id="pubn">Publier dans Explorer</button><button class="btn ghost" data-go="profile">Voir mes projets</button></div>';
  bind();$("#pubn").onclick=function(){var x=projects();x.forEach(function(r){if(r.id===p.id)r.public=true});save(x);this.disabled=true;this.textContent="Publié";refreshExp();toast("Publié dans Explorer")};$("#out").scrollIntoView({behavior:"smooth",block:"start"});
 }).catch(function(err){
  busy=false;go.disabled=false;go.textContent="Créer avec auraii";pg.style.display="none";bar.style.width="0";
  console.error(err);st.textContent=(err&&err.message&&err.message!=="Failed to fetch")?err.message:"La création a échoué. Vérifiez votre connexion et réessayez."});
}

function sc(t){var e=t==="home"?$("#top"):$("#"+t);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})}
// Affiche le bouton Connexion ou Déconnexion
function nav(){
 $("#auth").innerHTML=user?'<button class="btn ghost" id="lo">Déconnexion</button>':'<button class="btn" id="li">Connexion</button>';
 if($("#lo"))$("#lo").onclick=function(){user=null;ls("fab_session","");if(window.fb)window.fb.logout().catch(function(e){console.error(e)});toast("Vous êtes déconnecté");nav();location.hash="home";route()};
 if($("#li"))$("#li").onclick=function(){openAuth("login")};
}
// Affiche la bonne page selon l’adresse (#profile, #list…)
function route(){
 var h=hv();$("#n-profile").setAttribute("aria-current",h==="profile"?"page":"false");$("#n-list").setAttribute("aria-current",h==="list"?"page":"false");
 if(h==="profile")profile();else if(h==="list")listView();else home();
 bind();scrollTo(0,0)}

function openAuth(m){mode=m;aui();$("#ae").textContent="";$("#ad").showModal()}
// Adapte le texte de la fenêtre (connexion ou inscription)
function aui(){var s=mode==="signup";$("#at").textContent=s?"Rejoignez auraii":"Connexion";$("#as").textContent=s?"Gratuit. Vos projets restent privés par défaut.":"Retrouvez tous vos projets.";$("#nw").hidden=!s;$("#asb").textContent=s?"Créer mon compte":"Se connecter";$("#asw").textContent=s?"J’ai déjà un compte":"Créer un compte"}
$("#asw").onclick=function(){mode=mode==="login"?"signup":"login";aui();$("#ae").textContent=""};
// Traduit un code d’erreur Firebase en message français
function fbMsg(c){var M={"auth/email-already-in-use":"Un compte existe déjà avec cet e-mail.","auth/invalid-credential":"E-mail ou mot de passe incorrect.","auth/wrong-password":"E-mail ou mot de passe incorrect.","auth/user-not-found":"E-mail ou mot de passe incorrect.","auth/invalid-login-credentials":"E-mail ou mot de passe incorrect.","auth/invalid-email":"Adresse e-mail invalide.","auth/weak-password":"Mot de passe trop faible (6 caractères minimum).","auth/too-many-requests":"Trop de tentatives. Réessayez dans quelques minutes.","auth/network-request-failed":"Problème de connexion internet. Réessayez.","auth/operation-not-allowed":"La connexion par e-mail n’est pas activée dans Firebase.","auth/unauthorized-domain":"Ce site n’est pas autorisé dans Firebase (domaines autorisés)."};return M[c]||"Une erreur est survenue. Réessayez."}
// Mémorise le compte connecté (session + nom affiché sur les projets publics)
function remember(u){user=u;ls("fab_session",JSON.stringify(u));var U=jget("fab_users",{});U[u.email]={name:u.name};ls("fab_users",JSON.stringify(U))}
// Rafraîchit la page affichée après un changement de compte
function refreshView(){var h=hv();if(h==="profile")profile();else if(h==="list")listView();else if($("#exr"))refreshExp()}
// Appelée par Firebase (PARTIE 4) quand l’état de connexion change (ouverture du site, autre onglet, déconnexion)
window.auraiiSetUser=function(u){
 if(u){if(user&&user.uid===u.uid)return;remember(u)}
 else{if(!user)return;user=null;ls("fab_session","")}
 nav();refreshView()};
// Formulaire de connexion / création de compte
$("#af").onsubmit=async function(e){
 e.preventDefault();
 var m=$("#am").value.trim().toLowerCase(),pw=$("#ap").value,btn=$("#asb");
 if(!window.fb){$("#ae").textContent="Le service de connexion n’est pas prêt. Vérifiez votre connexion internet puis réessayez.";return}
 $("#ae").textContent="";btn.disabled=true;
 try{
  var u=mode==="signup"?await window.fb.signup(m,pw,$("#an").value.trim()):await window.fb.login(m,pw);
  remember(u);$("#ad").close();nav();toast("Bienvenue, "+user.name);
  refreshView();if(pending){pending=false;setTimeout(start,100)}
  $("#af").reset();
 }catch(err){console.error(err);$("#ae").textContent=fbMsg(err&&err.code)}
 btn.disabled=false};
$("#vc").onclick=function(){$("#vd").close()};
$("#vx").onclick=function(){$("#vd").close()};
$("#ax").onclick=function(){$("#ad").close()};
["ad","vd"].forEach(function(id){var d=$("#"+id);d.addEventListener("click",function(e){var r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()})});
$("#ad").addEventListener("close",function(){pending=false});
window.addEventListener("hashchange",route);
nav();route();
})();
</script>
<!-- ################ PARTIE 4 : FIREBASE (comptes clients) ################
  Ce bloc relie le site à Firebase Authentication (e-mail + mot de passe).
  Il crée « window.fb » (inscription, connexion, déconnexion) utilisé par la
  PARTIE 3, et prévient le site quand quelqu’un se connecte ou se déconnecte.
  Pour changer de projet Firebase, modifiez uniquement firebaseConfig.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

  // Configuration de votre projet Firebase (fournie par la console Firebase)
  const firebaseConfig = {
    apiKey: "AIzaSyDpH346anacsLeQcrYPZT81BZLo8tFLh84",
    authDomain: "auraii-web.firebaseapp.com",
    projectId: "auraii-web",
    storageBucket: "auraii-web.firebasestorage.app",
    messagingSenderId: "504710933038",
    appId: "1:504710933038:web:69849a8022532cb4504dbf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Transforme un utilisateur Firebase en objet simple utilisé par le site
  const simple = (u, fallbackEmail) => {
    const email = (u.email || fallbackEmail || "").toLowerCase();
    return { uid: u.uid, email: email, name: u.displayName || email.split("@")[0] };
  };

  // Fonctions utilisées par la PARTIE 3 (formulaire de connexion, bouton Déconnexion)
  window.fb = {
    signup: async (email, pw, name) => {
      const c = await createUserWithEmailAndPassword(auth, email, pw);
      const n = name || email.split("@")[0];
      try { await updateProfile(c.user, { displayName: n }); } catch (e) { console.warn(e); }
      return { uid: c.user.uid, email: email.toLowerCase(), name: n };
    },
    login: async (email, pw) => simple((await signInWithEmailAndPassword(auth, email, pw)).user, email),
    logout: () => signOut(auth),
    // Jeton prouvant que l’utilisateur est connecté (envoyé au serveur IA)
    token: async () => auth.currentUser ? await auth.currentUser.getIdToken() : null
  };

  // Firebase prévient le site à chaque changement (réouverture du site, déconnexion...)
  onAuthStateChanged(auth, (u) => {
    if (window.auraiiSetUser) window.auraiiSetUser(u ? simple(u) : null);
  });
</script>
